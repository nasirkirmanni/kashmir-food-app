<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wazwan Way — Hero blend fix</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    font-family: 'Inter', sans-serif;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 640px;
    background: #050403;
    display: flex;
    overflow: hidden;
  }

  /* Right image layer */
  .hero-image {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.55) 100%),
      radial-gradient(circle at 68% 30%, rgba(120,150,90,0.5), transparent 55%),
      linear-gradient(200deg, #d9a24a 0%, #6b5a34 22%, #2c3a24 45%, #14201a 70%, #0a0f0c 100%);
    filter: saturate(0.9);
  }

  /* The blend: fades pure black (matching left panel) into the image */
  .hero-blend {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      #050403 0%,
      #050403 8%,
      rgba(5,4,3,0.85) 20%,
      rgba(5,4,3,0.45) 32%,
      rgba(5,4,3,0.12) 42%,
      rgba(5,4,3,0) 52%
    );
  }

  /* subtle gold vignette tying the two halves together */
  .hero-gold-wash {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 85%, rgba(212,165,90,0.06), transparent 60%);
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    width: 46%;
    min-width: 380px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 60px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #d4a55a;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 28px;
  }
  .eyebrow .line { width: 28px; height: 1px; background: #d4a55a; display: inline-block; }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 56px;
    line-height: 1.15;
    color: #f2ede4;
    margin-bottom: 28px;
  }
  h1 em { color: #d4a55a; font-style: italic; }

  p.sub {
    color: #a8a29a;
    font-size: 16px;
    line-height: 1.7;
    max-width: 420px;
    margin-bottom: 40px;
  }

  .cta-row { display: flex; gap: 16px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 26px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .btn-primary { background: #d4a55a; color: #1a1208; }
  .btn-secondary { background: rgba(255,255,255,0.06); color: #f2ede4; border: 1px solid rgba(255,255,255,0.15); }

  .toggle-note {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 3;
    background: rgba(0,0,0,0.5);
    color: #d4a55a;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid rgba(212,165,90,0.3);
  }
</style>
</head>
<body>

<div class="hero">
  <div class="toggle-note">BEFORE / AFTER — see notes below</div>
  <div class="hero-image"></div>
  <div class="hero-blend"></div>
  <div class="hero-gold-wash"></div>

  <div class="hero-content">
    <div class="eyebrow"><span class="line"></span>DISCOVER PARADISE</div>
    <h1>What should you<br>explore in <em>Kashmir</em><br>today?</h1>
    <p class="sub">Hidden waterfalls, quiet valleys, and the secret corners locals love. Embark on an immersive journey through the crown of India.</p>
    <div class="cta-row">
      <div class="btn btn-primary">→ PLAN YOUR TRIP</div>
      <div class="btn btn-secondary">✦ USE WAZA AI</div>
    </div>
  </div>
</div>

</body>
</html>
